<!DOCTYPE html>
<html lang="{{lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{meta.title}}</title>
    <meta name="description" content="{{meta.desc}}">
    <link rel="canonical" href="{{url}}">
    <link rel="alternate" hreflang="hr" href="https://nmsolux.com/">
    <link rel="alternate" hreflang="en" href="https://nmsolux.com/en/">
    <link rel="alternate" hreflang="x-default" href="https://nmsolux.com/">
    <meta name="geo.region" content="HR" />
    <meta name="geo.placename" content="{{meta.geo}}" />
    <!-- Open Graph -->
    <meta property="og:title" content="{{meta.title}}">
    <meta property="og:description" content="{{meta.desc}}">
    <meta property="og:image" content="{{og_image}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="{{meta.og_alt}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="{{og_locale}}">
    <meta property="og:locale:alternate" content="{{og_locale_alt}}">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{meta.title}}">
    <meta name="twitter:description" content="{{meta.desc}}">
    <meta name="twitter:image" content="{{og_image}}">
    <meta name="twitter:image:alt" content="{{meta.og_alt}}">
    <link rel="icon" type="image/x-icon" href="{{base}}assets/images/favcon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="{{base}}assets/images/favcon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{base}}assets/images/favcon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{base}}assets/images/favcon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="{{base}}assets/images/favcon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="{{base}}assets/images/favcon/android-chrome-512x512.png">
{{@jsonld}}
